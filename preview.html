function shop(a){if(a)audience=a;return header('Shop')+`<main><div class="shop-title"><p class="breadcrumb">Home / The collection</p><h1>A considered collection.</h1><p>Quiet statements. Endless possibilities. Find your everyday extraordinary.</p><input id="search" class="search" placeholder="Search for your next favourite piece…" value="${esc(query)}" oninput="query=this.value;renderGrid()" aria-label="Search products"></div><div class="shop-bar"><div class="tabs">${['All','Women','Men','Kids'].map(x=>`<button class="${audience===x?'selected':''}" onclick="audience='${x}';location.hash='/shop/${x}';render()">${x==='All'?'All pieces':x}</button>`).join('')}</div><div><span id="count" class="list-count"></span>&nbsp;&nbsp;<select aria-label="Sort products" onchange="sort=this.value;renderGrid()">${[['featured','Featured'],['low','Price: low to high'],['high','Price: high to low'],['name','Name: A–Z']].map(([v,n])=>`<option value="${v}" ${sort===v?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="shop-body"><aside class="filters"><h3>THE CATEGORIES</h3>${['All',...cats].map(c=>`<button class="${category===c?'selected':''}" onclick="category='${c}';render()">${c==='All'?'All categories':c}</button>`).join('')}</aside><div><div class="products" id="grid"></div></div></div></main>`+footer()}
function renderGrid(){let list=products.filter(p=>(audience==='All'||p.audience===audience)&&(category==='All'||p.category===category)&&(p.name+' '+p.category+' '+p.material).toLowerCase().includes(query.toLowerCase()));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));$('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No pieces match. Try another category or search.</div>';$('#count').textContent=list.length+' pieces'}
function productPage(id){const p=products.find(x=>x.id===Number(id));if(!p)return header()+`<div class="empty">This piece is no longer available. <a href="#/shop">Browse the collection.</a></div>`+footer();size=['Bags','Accessories'].includes(p.category)?'One size':'M';return header('Shop')+`<main class="detail"><p class="breadcrumb"><a href="#/shop">The collection</a> / ${esc(p.category)} / ${esc(p.name)}</p><div class="detail-grid"><div class="detail-stage" id="stage"><button class="viewer-toggle" onclick="toggle3D(${p.id},this)">◇ &nbsp; Explore in 3D</button><div id="stage-art" style="width:100%;display:flex;justify-content:center">${art(p)}</div><div class="stage-caption">TRANSPARENT CONCEPT ART / PROCEDURAL 3D PREVIEW</div></div><div class="detail-info"><p class="micro">${esc(p.audience)} / ${esc(p.category)} / EDITION ${String(p.id).padStart(3,'0')}</p><h1>${esc(p.name)}</h1><div class="price">${money(p.price)}</div><p class="description">${esc(p.story)}</p><p class="micro">COLOUR — SIGNATURE ${p.color.slice(1).toUpperCase()}</p><i class="swatch" style="background:${p.color};width:22px;height:22px;margin:15px 0 25px"></i><p class="micro">SELECT SIZE</p><div class="sizes">${(size==='One size'?['One size']:['XS','S','M','L','XL']).map(s=>`<button class="${size===s?'selected':''}" onclick="size='${s}';document.querySelectorAll('.sizes button').forEach(x=>x.classList.toggle('selected',x.textContent===size))">${s}</button>`).join('')}</div><button class="solid" onclick="addBag(${p.id})" ${p.stock<1?'disabled':''}>${p.stock>0?'Add to bag':'Sold out'} <span>↗</span></button><p class="small">${p.stock} available · Demo collection · No payment required</p><details class="disclosure" open><summary>THE STORY & MAKING</summary><p>${esc(p.material)}. Concept construction: pattern development, cutting, assembly and a final finish. These details illustrate the intended product story; sourcing and production are not verified.</p></details><details class="disclosure"><summary>CARE & DETAILS</summary><p>Sample care guidance: handle gently and follow the final garment label when available. All sizes are demonstration options. True garment measurements and certified care instructions will be added with real inventory.</p></details><details class="disclosure"><summary>DELIVERY & RETURNS</summary><p>This is a demonstration store. Orders are recorded for testing; no payment, shipment or return service is provided.</p></details></div></div></main><section class="section"><div class="section-head"><h2>In good company.</h2><a href="#/shop" class="text-link">Explore more ↗</a></div><div class="products">${products.filter(x=>x.audience===p.audience&&x.id!==p.id).slice(0,4).map(card).join('')}</div></section>`+footer()}
function brand(){return header('Our story')+`<main class="brand"><p class="micro">THE WORLD OF LIZE / A CONCEPT BRAND</p><h1>A little less noise.<br>A little more meaning.</h1><p>We imagine a wardrobe built around you. Pieces that feel familiar from the first wear, with enough character to become entirely your own.</p><div class="story-strip" style="margin:50px 0"><div class="story-visual">${art({category:'Jackets',color:'#8b8e78',name:'Atelier construction concept'})}</div><div class="story-copy"><p class="micro">THE DESIGN PHILOSOPHY</p><h2>Intention in<br>every detail.</h2><p>LIZE is a premium fashion concept: modern proportions, an earthy palette, and an appreciation for the small things. This demo explores how a brand can tell a richer product story.</p></div></div><div class="brand-grid"><div><span class="micro">01 / THE IDEA</span><h2>Start with purpose.</h2><p>A silhouette begins with a question: how will this piece fit into a real day? Our concept collection explores useful shapes with a quiet point of view.</p></div><div><span class="micro">02 / THE MATERIAL</span><h2>Feel the difference.</h2><p>Texture gives a piece its character. The materials shown here are illustrative; real fiber compositions, suppliers and certifications belong with the final products.</p></div><div><span class="micro">03 / THE MAKING</span><h2>Bring it to life.</h2><p>Pattern, cut, assemble, finish. Each product page makes room for the journey, ready for real workshop photography, provenance and garment details.</p></div></div><a href="#/shop" class="solid">Find your perspective ↗</a></main>`+footer()}
function persistBag(){localStorage.setItem('lize-bag',JSON.stringify(bag))}
function addBag(id){let p=products.find(x=>x.id===id),existing=bag.find(x=>x.id===id&&x.size===size);let total=bag.filter(x=>x.id===id).reduce((a,x)=>a+x.qty,0);if(total>=p.stock)return toast('No more stock available');if(existing)existing.qty++;else bag.push({id,size,qty:1});persistBag();toast('Added to your bag');showBag()}
function qty(i,delta){const p=products.find(x=>x.id===bag[i].id);if(delta>0&&bag.filter(x=>x.id===p.id).reduce((a,x)=>a+x.qty,0)>=p.stock)return toast('No more stock available');bag[i].qty+=delta;if(bag[i].qty<1)bag.splice(i,1);persistBag();showBag()}
function closeOverlay(){$('#overlay').innerHTML='';document.body.style.overflow=''}
function overlay(html){$('#overlay').innerHTML=`<div class="drawer">${html}</div>`;document.body.style.overflow='hidden';$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeOverlay()};$('#overlay button')?.focus()}
function showBag(){bag=bag.filter(x=>products.some(p=>p.id===x.id));persistBag();let total=bag.reduce((n,i)=>n+products.find(p=>p.id===i.id).price*i.qty,0);overlay(`<div class="drawer-head"><h2>Your bag (${bag.reduce((n,x)=>n+x.qty,0)})</h2><button onclick="closeOverlay()" aria-label="Close bag">✕</button></div>${bag.length?bag.map((i,index)=>{let p=products.find(x=>x.id===i.id);return `<div class="bag-line">${art(p)}<div><h3>${esc(p.name)}</h3><p>Size ${esc(i.size)}</p><div class="qty"><button aria-label="Decrease quantity" onclick="qty(${index},-1)">−</button><span>${i.qty}</span><button aria-label="Increase quantity" onclick="qty(${index},1)">+</button></div></div><span>${money(p.price*i.qty)}</span></div>`}).join('')+`<div class="bag-total"><span>Subtotal</span><span>${money(total)}</span></div><div class="notice">Demo checkout. No money is charged and no items are shipped. Submitting reserves stock and records a test order.</div><form onsubmit="checkout(event)"><label class="small" for="email">Email for this test order</label><input id="email" type="email" required placeholder="you@example.com"><button class="solid">Place demo order <span>↗</span></button><p class="error" id="checkout-error"></p></form>`:'<p class="small">Your next favourite piece is waiting.</p><a class="solid" href="#/shop" onclick="closeOverlay()" style="margin-top:25px">Explore the collection ↗</a>'}`)}
async function checkout(e){e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const order=await api('orders',{email:$('#email').value,items:bag});bag=[];persistBag();products=await api('products');overlay(`<div class="drawer-head"><h2>A considered choice.</h2><button onclick="closeOverlay();render()" aria-label="Close">✕</button></div><p>Demo order ${esc(order.id)} has been recorded.</p><div class="notice">Total: ${money(order.total)}. No payment was collected. Nothing will be shipped.</div><button class="solid" onclick="closeOverlay();render()">Continue exploring ↗</button>`)}catch(err){$('#checkout-error').textContent=err.message;btn.disabled=false}}
function toggle3D(id,btn){if(viewerCleanup){viewerCleanup();viewerCleanup=null;$('#stage-art').innerHTML=art(products.find(p=>p.id===id));btn.textContent='◇  Explore in 3D';return}btn.textContent='◇  Back to illustration';$('#stage-art').innerHTML='<canvas id="viewer" aria-label="Interactive procedural 3D garment. Drag to rotate; scroll to zoom."></canvas>';makeViewer(products.find(p=>p.id===id))}
function makeViewer(p){const canvas=$('#viewer'),ctx=canvas.getContext('2d'),path=new Path2D(shape(p.category)),probe=document.createElement('canvas').getContext('2d'),vertices=[],faces=[],depth=p.category==='Bags'?24:9;
// Extrude a sampled silhouette into a real, closed volume. Canvas projects shaded 3D triangles.
for(let y=45;y<280;y+=5)for(let x=45;x<255;x+=5){if(!probe.isPointInPath(path,x+2.5,y+2.5))continue;let z=depth+4*Math.sin(x/15)*Math.sin(y/70);let quad=[[x,y],[x+5,y],[x+5,y+5],[x,y+5]];faces.push({v:quad.map(([x,y])=>[x-150,y-160,z]),side:1},{v:quad.map(([x,y])=>[x-150,y-160,-z]).reverse(),side:-1});for(let [dx,dy,a,b] of [[0,-5,0,1],[5,0,1,2],[0,5,2,3],[-5,0,3,0]])if(!probe.isPointInPath(path,x+2.5+dx,y+2.5+dy))faces.push({v:[[...quad[a],z],[...quad[b],z],[...quad[b],-z],[...quad[a],-z]].map(([x,y,z])=>[x-150,y-160,z]),side:0})}
let angle=-.3,tilt=.08,zoom=1,drag=false,lastX,lastY,frame,alive=true;const rgb=p.color.match(/[0-9a-f]{2}/gi).map(x=>parseInt(x,16));function draw(){if(!alive)return;const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==r.width*dpr||canvas.height!==r.height*dpr){canvas.width=r.width*dpr;canvas.height=r.height*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);let ca=Math.cos(angle),sa=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt),scale=Math.min(r.width/340,r.height/330)*zoom;let transformed=faces.map(f=>{const v=f.v.map(([x,y,z])=>{let X=x*ca+z*sa,Z=-x*sa+z*ca,Y=y*ct-Z*st;Z=y*st+Z*ct;let persp=650/(650-Z);return [r.width/2+X*scale*persp,r.height/2+Y*scale*persp,Z]});return {v,z:v.reduce((n,p)=>n+p[2],0)/4,shade:f.side===0?.48:.73+.22*Math.max(0,f.side*ca)+.06*Math.sin(f.v[0][0]/12)}}).sort((a,b)=>a.z-b.z);ctx.save();ctx.filter='blur(12px)';ctx.fillStyle='#36362620';ctx.beginPath();ctx.ellipse(r.width/2,r.height*.87,80*zoom,12,0,0,Math.PI*2);ctx.fill();ctx.restore();for(let f of transformed){ctx.beginPath();f.v.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=`rgb(${rgb.map(c=>Math.round(c*f.shade)).join(',')})`;ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.5;ctx.stroke()}ctx.fillStyle='#74786e';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText('DRAG TO ROTATE · SCROLL TO ZOOM',r.width/2,r.height-40);if(!drag&&!matchMedia('(prefers-reduced-motion: reduce)').matches)angle+=.003;frame=requestAnimationFrame(draw)}
canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){angle+=(e.clientX-lastX)*.012;tilt=Math.max(-.6,Math.min(.6,tilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.6,zoom-e.deltaY*.001))};draw();viewerCleanup=()=>{alive=false;cancelAnimationFrame(frame)}}
function adminLogin(){return header()+`<main class="login"><p class="micro">LIZE / STORE MANAGEMENT</p><h1>Welcome to the atelier.</h1><p class="small">Sign in to manage your catalog, inventory and demo orders.</p><form onsubmit="login(event)"><input id="password" type="password" required placeholder="Admin password" autocomplete="current-password" aria-label="Admin password"><button class="solid">Sign in <span>↗</span></button><p class="error" id="login-error"></p></form><div class="notice">First setup: configure an ADMIN_PASSWORD of at least 12 characters on the server. No default password is installed. See the included setup guide.</div></main>`}
async function login(e){e.preventDefault();try{await api('login',{password:$('#password').value});session=true;overview=await api('admin/overview');render()}catch(err){$('#login-error').textContent=err.message}}
async function logout(){await api('logout',{});session=false;overview=null;render()}
function admin(){if(!session)return adminLogin();return `<div class="admin-shell"><aside class="sidebar"><a href="#/" class="logo">${esc(settings.brand)}</a><p class="micro">THE MANAGEMENT ATELIER</p>${['Overview','Analytics','Live visitors','Products','Inventory','Orders','Site images','Settings'].map(t=>`<button class="${adminTab===t?'active':''}" onclick="adminTab='${t}';render()">${t}</button>`).join('')}<a href="#/">↗ View storefront</a><button onclick="logout()">Sign out</button></aside><main class="admin-main"><div class="admin-top"><div><p class="micro">YOUR STORE, CONSIDERED.</p><h1>${adminTab}</h1><p>Real store records · Demo commerce · USD</p></div><button class="outline" onclick="refreshAdmin()">↻ Refresh data</button></div>${adminContent()}</main></div>`}
function adminContent(){const o=overview||{orders:[],live:[],revenue:0,visitors:0,low_stock:0};if(['Overview','Analytics'].includes(adminTab)){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d}),sums=days.map(d=>o.orders.filter(x=>new Date(x.created*1000).toDateString()===d.toDateString()&&x.status!=='Cancelled').reduce((a,x)=>a+x.total,0)),max=Math.max(...sums,1);return `<div class="stats">${[['Demo order value',money(o.revenue),'Excludes cancelled orders'],['Orders',o.orders.length,'All recorded test orders'],['Unique visitors',o.visitors,'Per browser visitor identifier'],['Live now',o.live.length,'Active in the last 60 seconds']].map(([n,v,d])=>`<div class="stat"><small>${n}</small><strong>${v}</strong><span>${d}</span></div>`).join('')}</div><div class="admin-grid"><section class="panel"><h2>Order value over time</h2><div class="chart">${sums.map((n,i)=>`<div style="height:${Math.max(1,n/max*100)}%" title="${days[i].toLocaleDateString()}: ${money(n)}"><span>${days[i].toLocaleDateString('en',{weekday:'short'})}</span></div>`).join('')}</div><p class="small">Last 7 days · ${money(sums.reduce((a,b)=>a+b,0))} in demo orders. ${o.orders.length?'':'No orders yet — place a demo order to see activity.'}</p></section><section class="panel"><h2>At a glance</h2><p class="small">${products.length} catalog pieces<br>${products.reduce((n,p)=>n+p.stock,0)} units in inventory<br>${o.low_stock} products below 10 units<br>${o.orders.filter(x=>x.status==='Processing').length} orders processing</p><div class="notice">Order values are test activity, not real sales. Live visitors are measured by a 20-second heartbeat.</div></section></div><h2 style="font:28px var(--serif);margin-top:35px">Recent orders</h2>${orderTable(o.orders.slice(0,8))}`}
if(adminTab==='Live visitors')return `<section class="panel"><h2><span class="live-dot">●</span> ${o.live.length} active visitors</h2><p class="small">Updates automatically every 20 seconds. An active visitor has sent a heartbeat within the past minute. No IP addresses are stored.</p>${o.live.length?`<div class="table-wrap"><table><thead><tr><th>Session</th><th>Current page</th><th>Last seen</th></tr></thead><tbody>${o.live.map((v,i)=>`<tr><td>Visitor ${i+1}</td><td>${esc(v.page)}</td><td>${new Date(v.last_seen*1000).toLocaleTimeString()}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No active visitors yet.</p>'}</section>`;
if(['Products','Inventory'].includes(adminTab))return `<div class="admin-tools"><input id="admin-search" placeholder="Search the catalog…" aria-label="Search catalog" oninput="adminProductRows(this.value)"><button class="solid" onclick="editProduct()">+ Add product</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Audience</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="admin-products">${productRows(products)}</tbody></table></div>`;
if(adminTab==='Orders')return `<div class="notice">These are demonstration orders. Status changes do not charge customers or trigger shipments. Cancelling an order restores its reserved stock once.</div>${orderTable(o.orders)}`;
if(adminTab==='Site images')return `<form class="admin-form panel" onsubmit="saveSettings(event)"><h2>Campaign imagery</h2><p class="small">The catalog uses transparent concept illustrations. Set a secure image URL to replace the homepage campaign artwork. Leave it empty to restore the illustrated jacket.</p><label for="hero_image">Homepage campaign image — HTTPS URL</label><input id="hero_image" name="hero_image" type="url" placeholder="https://…" value="${esc(settings.hero_image)}"><button class="solid">Save campaign image ↗</button><p class="small">A production media upload service and photography can be connected later.</p></form>`;
return `<form class="admin-form panel" onsubmit="saveSettings(event)"><h2>The brand essentials</h2><p class="small">Changes appear in the storefront immediately.</p>${[['brand','Brand name'],['announcement','Announcement bar'],['hero_title','Homepage headline'],['hero_subtitle','Homepage introduction']].map(([k,n])=>`<label for="${k}">${n}</label>${k.includes('hero')?`<textarea id="${k}" name="${k}" required>${esc(settings[k])}</textarea>`:`<input id="${k}" name="${k}" required value="${esc(settings[k])}">`}`).join('')}<button class="solid">Save settings ↗</button><div class="notice">Currency: USD. Payments, delivery integrations and real garment media are not connected. Admin credentials are configured securely on the server.</div></form>`}
function orderTable(orders){return `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Created</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.email)}</td><td>${o.items.map(i=>`${esc(i.name)} (${esc(i.size)}) × ${i.qty}`).join('<br>')}</td><td>${money(o.total)}</td><td><select aria-label="Status of ${esc(o.id)}" onchange="changeStatus('${o.id}',this.value)" ${o.status==='Cancelled'?'disabled':''}>${['Demo order','Processing','Shipped','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(o.created*1000).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No demo orders yet.</td></tr>'}</tbody></table></div>`}
function productRows(list){return list.map(p=>`<tr><td><span class="thumb">${art(p)}${esc(p.name)}</span></td><td>${esc(p.category)}</td><td>${esc(p.audience)}</td><td>${money(p.price)}</td><td><span class="status" style="${p.stock<10?'background:#f0dfcd':''}">${p.stock} units</span></td><td><button onclick="editProduct(${p.id})">Edit</button></td></tr>`).join('')||'<tr><td colspan="6">No products found.</td></tr>'}
function adminProductRows(q){$('#admin-products').innerHTML=productRows(products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q.toLowerCase())))}
function editProduct(id){const p=products.find(x=>x.id===id)||{name:'',category:'Jackets',audience:'Women',price:150,stock:10,color:'#8b8c76',material:'Demo: woven textile',story:''};overlay(`<div class="drawer-head"><h2>${id?'Edit piece':'A new piece'}</h2><button aria-label="Close editor" onclick="closeOverlay()">✕</button></div><form class="edit-form" onsubmit="saveProduct(event,${id||'null'})"><label>Name</label><input name="name" required value="${esc(p.name)}"><label>Category</label><select name="category">${cats.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Audience</label><select name="audience">${['Women','Men','Kids'].map(c=>`<option ${p.audience===c?'selected':''}>${c}</option>`).join('')}</select><label>Price (USD, whole dollars)</label><input name="price" type="number" min="1" step="1" required value="${p.price}"><label>Stock units</label><input name="stock" type="number" min="0" step="1" required value="${p.stock}"><label>Illustration color</label><input name="color" type="color" value="${p.color}"><label>Material</label><input name="material" required value="${esc(p.material)}"><label>Product story</label><textarea name="story" required>${esc(p.story)}</textarea><button class="solid">Save product ↗</button><p id="product-error" class="error"></p></form>${id?`<button class="outline" style="margin-top:20px" onclick="deleteProduct(${id},this)">Delete product</button>`:''}`)}
async function saveProduct(e,id){e.preventDefault();try{let b=Object.fromEntries(new FormData(e.target));await api('admin/products'+(id?'/'+id:''),b,id?'PUT':'POST');closeOverlay();await refreshAdmin();toast('Product saved')}catch(err){$('#product-error').textContent=err.message}}
async function deleteProduct(id,btn){if(btn.dataset.confirm!=='yes'){btn.dataset.confirm='yes';btn.textContent='Confirm delete — click again';return}try{await api('admin/products/'+id,{},'DELETE');closeOverlay();await refreshAdmin();toast('Product deleted')}catch(e){toast(e.message)}}
async function saveSettings(e){e.preventDefault();try{await api('admin/settings',Object.fromEntries(new FormData(e.target)));settings=await api('settings');toast('Store updated')}catch(err){toast(err.message)}}
async function changeStatus(id,status){try{await api('admin/orders/'+id,{status},'PUT');await refreshAdmin();toast('Order updated')}catch(e){toast(e.message);await refreshAdmin()}}
async function refreshAdmin(){try{[products,overview]=await Promise.all([api('products'),api('admin/overview')]);render()}catch(e){toast(e.message)}}
function render(){if(viewerCleanup){viewerCleanup();viewerCleanup=null}const path=(location.hash.slice(1)||'/').split('/').filter(Boolean);let html;if(path[0]==='shop'){html=shop(path[1]);}else if(path[0]==='product')html=productPage(path[1]);else if(path[0]==='brand')html=brand();else if(path[0]==='admin')html=admin();else if(path[0]==='wishlist')html=header()+`<h1 class="wishlist-title">Your considered edit.</h1><section class="section"><div class="products">${products.filter(p=>wishes.includes(p.id)).map(card).join('')||'<p class="small">Save the pieces you love with the heart icon.</p>'}</div></section>`+footer();else html=home();$('#app').innerHTML=html;if(path[0]==='shop')renderGrid();document.title=(path[0]==='admin'?'Store management':path[0]==='product'?products.find(p=>p.id==path[1])?.name||'The collection':path[0]==='shop'?'The collection':path[0]==='brand'?'Our story':'A considered wardrobe')+' — '+settings.brand}
let visitor=localStorage.getItem('lize-visitor');if(!visitor){visitor=crypto.randomUUID();localStorage.setItem('lize-visitor',visitor)}
async function heartbeat(){try{if(location.hash.startsWith('#/admin')){if(session){overview=await api('admin/overview');if(adminTab==='Live visitors'&&!$('#overlay').innerHTML)render()}}else if(!document.hidden)await api('visit',{id:visitor,page:location.hash.slice(1)||'/'})}catch(e){}}
window.addEventListener('hashchange',()=>{closeOverlay();render();window.scrollTo(0,0);heartbeat()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});
